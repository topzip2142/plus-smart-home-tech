spring:
  application:
    name: analyzer
  datasource:
    url: jdbc:postgresql://localhost:5432/telemetry_analyzer
    username: dbuser
    password: 12345
  jpa:
    hibernate:
      ddl-auto: none
  sql:
    init:
      mode: always
      platform: postgresql
  kafka:
    bootstrap-servers: localhost:9092

analyzer:
  kafka:
    topics:
      hubs: telemetry.hubs.v1
      snapshots: telemetry.snapshots.v1
    consumer:
      hub-events-group-id: analyzer-hub-events
      snapshots-group-id: analyzer-snapshots
    poll-timeout-ms: 500

grpc:
  client:
    hub-router:
      address: 'static://localhost:59090'
      enableKeepAlive: true
      keepAliveWithoutCalls: true
      negotiationType: plaintext

logging:
  level:
    ru.yandex.practicum.analyzer: DEBUG
